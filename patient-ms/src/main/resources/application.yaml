server:
  port: 8081
  servlet:
    context-path: /
application:
  title: Patient Management System
  version: 1.0.0
spring:
  application:
    name: patient-ms

  main:
    banner-mode: console
  banner:
    charset: UTF-8
    location: banner.txt

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database: postgresql
    show-sql: true
    properties:
      hibernate:
        default_schema: patients

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: patients
    contexts: local

  sql:
    init:
      platform: postgres

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

logging:
  level:
    root: ERROR
    com.medical.assessment.patientms: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.security: TRACE