openapi: 3.0.3
info:
  title: Note MS Note API
  description: Note MS Note API
  version: 1.0.0

servers:
  - url: "/"
    description: "Current"
  - url: "http://localhost:8083"
    description: "localhost"

tags:
  - name: notes
    description: Everything for note MS about patient notes

security:
  - bearerAuth: []

paths:
  /notes:
    post:
      tags:
        - notes
      summary: add a note to a patient history
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateDto'
      responses:
        '201':
          description: note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDto'
        '400':
          description: Invalid input
        '404':
          description: patient not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /notes/patient/{patientId}:
    get:
      tags:
        - notes
      summary: get all notes for a patient
      operationId: getNotesByPatientId
      parameters:
        - in: path
          name: patientId
          required: true
          description: the id of the patient to retrieve notes for
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: list of notes for the patient
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteDto'
        '400':
          description: Invalid input
        '404':
          description: patient not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  schemas:
    NoteCreateDto:
      type: object
      properties:
        patientId:
          type: integer
          format: int64
          description: "the id of the patient to add the note for"
          x-field-extra-annotation: |
            @NotNull(message = "patient Id is required")
            @Positive(message = "patient Id must be a positive number")
          example: 1
        content:
          type: string
          description: "the content of the note"
          x-field-extra-annotation: |
            @NotBlank(message = "content is required")
            @Size(max = 2000, message = "content must not exceed 2000 characters")
          example: "This is a note about the patient's condition."
      required:
        - content

    NoteDto:
      type: object
      properties:
        id:
          type: string
          description: "the unique identifier of the note"
          example: "123456789"
          minimum: 1
        patientId:
          type: integer
          format: int64
          description: "the id of the patient to which the note belongs"
          minimum: 1
        content:
          type: string
          description: "the content of the note"
          example: "This is a note about the patient's condition."
        createdAt:
          type: string
          format: date-time
          description: "the date and time when the note was created"
          example: "2025-06-01T12:00:00Z"
      required:
        - id
        - patientId
        - content
        - createdAt
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT